name: cafebean

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Persian content and sorting depend on utf8mb4 end to end.
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:${WP_VERSION}-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WP_DEBUG}
      WORDPRESS_CONFIG_EXTRA: |
        /*
         * Derive the site URL from the request host instead of pinning it to
         * localhost. A tunnel such as ngrok arrives with its own hostname, and
         * a hard-coded WP_HOME would bounce every external visitor back to a
         * machine they cannot reach.
         */
        if ( ! empty( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
            $$_SERVER['HTTPS'] = 'on';
        }
        if ( ! empty( $$_SERVER['HTTP_HOST'] ) ) {
            $$cafebean_scheme = ( ! empty( $$_SERVER['HTTPS'] ) && 'off' !== $$_SERVER['HTTPS'] ) ? 'https' : 'http';
            define( 'WP_HOME', $$cafebean_scheme . '://' . $$_SERVER['HTTP_HOST'] );
            define( 'WP_SITEURL', $$cafebean_scheme . '://' . $$_SERVER['HTTP_HOST'] );
        } else {
            define( 'WP_HOME', '${WP_URL}' );
            define( 'WP_SITEURL', '${WP_URL}' );
        }
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISABLE_WP_CRON', true );
    volumes:
      - wp_core:/var/www/html
      # Only our own code is bind-mounted; core and plugins live in the volume.
      - ./wp-content/themes/cafebean-child:/var/www/html/wp-content/themes/cafebean-child
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins

  # Run one-off commands: docker compose run --rm wpcli wp <command>
  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX}
      # wp-cli has no web request, so WP_SITEURL alone leaves HTTP_HOST unset.
      HTTP_HOST: localhost:${WP_PORT}
      # The container runs as uid 33 with HOME=/, which it cannot write to, so
      # every command warns about its cache directory. Point it somewhere
      # writable instead.
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/cafebean-child:/var/www/html/wp-content/themes/cafebean-child
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./data:/data
      - ./dist:/dist
      - ./scripts:/scripts
    user: "33:33"

volumes:
  db_data:
  wp_core:
